name: Check
on:
  workflow_dispatch:
    inputs:
      android_ui:
        description: Run the isolated Android UI suite
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: python3 -m py_compile tests/android/*.py scripts/*.py
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      WORKSPACE_JOBS: 2
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK dependencies
        shell: bash
        run: |
          source scripts/env.sh
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: npm ci
      - run: bash scripts/build-android.sh preview x86_64
      - name: Isolated UI suite
        if: github.event_name == 'workflow_dispatch' && inputs.android_ui
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr imagemagick
          sudo chmod a+rw /dev/kvm
          source scripts/env.sh
          python3 scripts/setup-android-test.py
          apk="artifacts/preview/lime-$(node -p 'require("./package.json").version')-x86_64.apk"
          python3 tests/android/memo_theme_e2e.py --sdk "$PWD/.local/android-test-sdk" --out artifacts/ui --final-apk "$apk"
          python3 tests/android/memo_theme_e2e.py --sdk "$PWD/.local/android-test-sdk" --out artifacts/small --final-apk "$apk" --small-only
          python3 tests/android/memo_theme_e2e.py --sdk "$PWD/.local/android-test-sdk" --out artifacts/engineering --final-apk "$apk" --engineering-only
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: android-preview-and-ui-evidence
          path: artifacts/
          retention-days: 7
