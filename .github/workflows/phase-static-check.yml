name: Phase checks
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Completed scope to check
        required: true
        type: choice
        options: [workspace, core, assistant, channels, release]
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, verified tag
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5, verified tag
        with:
          node-version-file: .node-version
          cache: npm
      - run: python3 scripts/repository-check.py
      - run: npm ci
      - run: npm run typecheck
      - if: inputs.phase != 'workspace'
        run: npm run test:phase
